<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planer">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Planer</title>
</head>
<body>
  <header class="topbar">
    <div><div class="eyebrow">DEIN ÜBERBLICK</div><h1>Planer</h1></div>
    <button class="icon-btn" id="todayBtn" aria-label="Zum heutigen Tag">Heute</button>
  </header>

  <main>
    <section id="calendarView" class="view active">
      <div class="month-head">
        <button class="arrow" id="prevMonth" aria-label="Vorheriger Monat">‹</button>
        <h2 id="monthLabel"></h2>
        <button class="arrow" id="nextMonth" aria-label="Nächster Monat">›</button>
      </div>
      <div class="weekdays"><span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span></div>
      <div id="monthGrid" class="month-grid"></div>
      <div class="legend" id="legend"></div>
      <section class="day-panel">
        <div class="section-head"><div><div class="eyebrow">AUSGEWÄHLTER TAG</div><h3 id="selectedDateLabel"></h3></div><button class="text-btn" id="addFromDay">＋ Eintrag</button></div>
        <div id="dayEntries" class="entry-list"></div>
      </section>
    </section>

    <section id="tasksView" class="view">
      <div class="section-head page-title"><div><div class="eyebrow">ALLES IM BLICK</div><h2>Aufgaben</h2></div><button class="text-btn" id="addTask">＋ Aufgabe</button></div>
      <div class="filter-row"><button class="filter active" data-filter="open">Offen</button><button class="filter" data-filter="all">Alle</button><button class="filter" data-filter="done">Erledigt</button></div>
      <div id="taskList" class="entry-list"></div>
    </section>

    <section id="categoriesView" class="view">
      <div class="section-head page-title"><div><div class="eyebrow">FARBEN & ORDNUNG</div><h2>Kategorien</h2></div><button class="text-btn" id="addCategory">＋ Neu</button></div>
      <p class="muted">Passe die Bereiche an deinen Alltag an. Jeder Eintrag kann einer Kategorie zugeordnet werden.</p>
      <div id="categoryList" class="category-list"></div>
    </section>
  </main>

  <button class="fab" id="fab" aria-label="Neuen Eintrag erstellen">＋</button>
  <nav class="bottom-nav">
    <button class="nav-item active" data-view="calendarView"><span>▦</span>Kalender</button>
    <button class="nav-item" data-view="tasksView"><span>✓</span>Aufgaben</button>
    <button class="nav-item" data-view="categoriesView"><span>◉</span>Kategorien</button>
  </nav>

  <dialog id="entryDialog">
    <form method="dialog" id="entryForm">
      <div class="dialog-head"><h2 id="dialogTitle">Neuer Eintrag</h2><button class="close" value="cancel" aria-label="Schließen">×</button></div>
      <label>Titel<input id="entryTitle" required maxlength="80" placeholder="z. B. Mathe-Vorlesung"></label>
      <div class="two-col"><label>Datum<input id="entryDate" type="date" required></label><label>Typ<select id="entryType"><option value="event">Termin</option><option value="task">Aufgabe / Frist</option></select></label></div>
      <div class="two-col" id="timeRow"><label>Beginn<input id="entryStart" type="time"></label><label>Ende<input id="entryEnd" type="time"></label></div>
      <label>Kategorie<select id="entryCategory"></select></label>
      <label>Notiz<textarea id="entryNote" rows="2" placeholder="Optional"></textarea></label>
      <div class="dialog-actions"><button type="button" class="danger hidden" id="deleteEntry">Löschen</button><button class="primary" value="save">Speichern</button></div>
    </form>
  </dialog>

  <dialog id="categoryDialog">
    <form method="dialog" id="categoryForm">
      <div class="dialog-head"><h2>Neue Kategorie</h2><button class="close" value="cancel">×</button></div>
      <label>Name<input id="categoryName" required maxlength="30" placeholder="z. B. Universität"></label>
      <label>Farbe<input id="categoryColor" type="color" value="#5276d9"></label>
      <div class="dialog-actions"><button class="primary" value="save">Speichern</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
